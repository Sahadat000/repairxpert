async function remoteSave(){

}

function shrink(file,m){m=m||700;return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.65))};i.src=r.result};r.readAsDataURL(file)})}

function addJob(){
  if(!g('j_name').trim()){err='Customer name is required';return render()}
  const e=+g('j_est')||0,j={id:uid(),no:'JOB-'+today().slice(2,4)+'-'+String(++DB.c.job).padStart(4,'0'),cname:g('j_name'),phone:g('j_phone'),model:g('j_model'),imei:g('j_imei'),problem:g('j_prob'),tech:g('j_tech')||'Unassigned',date:g('j_date'),est:e,price:e,extra:0,status:'Received',delivered:'',parts:[],pays:[]};
  DB.jobs.unshift(j);log('Job received',j.no+' '+j.cname);jf=0;save();render();
}
function delJob(id){
  if(!adm())return;
  const j=DB.jobs.find(x=>x.id===id);if(!j)return;
  if(!confirm('Remove '+j.no+' ('+j.cname+')? Its payments will be voided from income and used parts returned to stock. This is logged in the Activity Log.'))return;
  const ids=(j.pays||[]).map(p=>p.id);
  DB.tx.forEach(x=>{if(x.src&&ids.includes(x.src))x.void=true});
  (j.parts||[]).forEach(pt=>{const p=DB.prod.find(y=>y.id===pt.pid);if(p)p.qty+=pt.qty});
  DB.jobs=DB.jobs.filter(x=>x.id!==id);
  ex=null;log('Job removed',j.no+' '+j.cname);save();render();
}
function setStat(id,v){const j=DB.jobs.find(x=>x.id===id);j.status=v;j.delivered=v==='Delivered'?today():'';log('Job status',j.no+' → '+v);ex=null;save();render()}
function updJob(id){if(!adm())return;const j=DB.jobs.find(x=>x.id===id);j.price=+g('u_price')||0;j.extra=+g('u_extra')||0;log('Job price edited',j.no+' price '+taka(j.price)+' extra '+taka(j.extra));save();render()}
function addPart(id){
  const j=DB.jobs.find(x=>x.id===id),p=DB.prod.find(x=>x.id===g('pt_p')),q2=+g('pt_q');
  if(!p||!(q2>0))return;
  if(q2>p.qty){err='Not enough stock ('+p.qty+' left)';return render()}
  p.qty-=q2;j.parts.push({pid:p.id,name:p.name,qty:q2,cost:p.cost});log('Part used',j.no+' '+p.name+' × '+q2);save();render();
}
function addJP(id){
  const j=DB.jobs.find(x=>x.id===id),a=+g('jp_amt');
  if(!(a>0)){err='Enter a valid amount';return render()}
  if(a>jDue(j)){err='Amount is more than due ('+taka(jDue(j))+')';return render()}
  jobPay(id,a,g('jp_m'),today());save();render();
}

function addShop(){
  const n=g('sh_name').trim();if(!n){err='Folder name is required';return render()}
  const s={id:uid(),name:n,items:[]};SH().unshift(s);shf=false;shx=s.id;log('Shop folder added',n);save();render();
}
function addShopItem(id){
  const s=SH().find(x=>x.id===id);if(!s)return;
  const rows=[[g('si_item').trim(),+g('si_price'),true],...[2,3,4,5].map(n=>[g('si_i'+n).trim(),+g('si_p'+n),false])];
  const bad=rows.some(([n,p,req])=>(req||n||p)&&(!n||!(p>0)));
  if(bad){err='Item and price are required (leave extra rows empty if not used)';return render()}
  const date=g('si_date')||today(),model=g('si_model').trim();
  rows.filter(([n])=>n).forEach(([n,p])=>{
    const it={id:uid(),item:n,price:p,model,date};
    s.items.push(it);
    log('Shop item',s.name+' - '+n+' '+taka(p));
  });
  save();render();
}
function shDesc(s,it){return s.name+': '+it.item+(it.model?' ('+it.model+')':'')}
function saveShopItem(sid,iid){
  if(!adm())return;
  const s=SH().find(x=>x.id===sid);if(!s)return;
  const it=s.items.find(x=>x.id===iid);if(!it)return;
  const item=g('sx_item').trim(),price=+g('sx_price');
  if(!item||!(price>0)){err='Item and price are required';return render()}
  const old=it.item+' '+taka(it.price);
  it.item=item;it.price=price;it.model=g('sx_model').trim();it.date=g('sx_date')||it.date;
  log('Shop item edited',s.name+' - '+old+' -> '+it.item+' '+taka(it.price));ee=null;save();render();
}
function delShopItem(sid,iid){
  if(!adm())return;
  const s=SH().find(x=>x.id===sid);if(!s)return;
  const it=s.items.find(x=>x.id===iid);if(!it)return;
  if(!confirm('Delete "'+it.item+'" ('+taka(it.price)+')?'))return;
  DB.tx.forEach(x=>{if(x.src===iid)x.void=true});
  s.items=s.items.filter(x=>x.id!==iid);log('Shop item deleted',s.name+' - '+it.item+' '+taka(it.price));save();render();
}
function delShop(id){
  if(!adm())return;
  const s=SH().find(x=>x.id===id);if(!s)return;
  if(!confirm('Delete folder "'+s.name+'" with '+s.items.length+' item(s)?'))return;
  const ids=s.items.map(i=>i.id);
  DB.tx.forEach(x=>{if(x.src&&ids.includes(x.src))x.void=true});
  DB.shops=SH().filter(x=>x.id!==id);shx=null;log('Shop folder deleted',s.name);save();render();
}
function addT(type){const a=+g('t_amt');if(!(a>0)){err='Amount is required';return render()}addTx(type,g('t_cat'),a,g('t_desc'),g('t_m'),g('t_date'),null,sec==='common'?g('t_unit'):sec);if(type==='income'&&sec==='training'){const lt=DB.tx[DB.tx.length-1];lt.name=g('t_name').trim();lt.batch=g('t_batch').trim()}log('Manual '+type,g('t_cat')+' '+taka(a));save();render()}
function voidT(id){if(!adm())return;const x=DB.tx.find(y=>y.id===id);if(!confirm('Delete this record? It stays in the Activity Log.'))return;x.void=true;if(x.src)DB.sal=DB.sal.filter(y=>y.id!==x.src);log('Record voided',x.cat+' '+taka(x.amt)+' '+x.desc);save();render()}

/* ---------- Inventory ---------- */
function invP(){
  const low=DB.prod.filter(p=>p.qty<=p.min);
  return `<h2>${t('Inventory')}</h2>${low.length?`<div class="warn">⚠ ${t('Low Stock')}: ${low.map(p=>esc(p.name)+' ('+p.qty+')').join(', ')}</div>`:''}
  <div class="card"><div class="form">${F('i_name','Name')}${F('i_qty','Quantity','number')}${F('i_cost','Purchase Price','number')}${F('i_sup','Supplier')}${F('i_date','Date','date',today())}<button class="btn" onclick="addProd()">${t('Add')} / Restock</button></div><small class="g">Same name = restock. Purchase is saved once as "Parts Purchase" expense.</small></div>
  ${tbl(['Name','Quantity','Purchase Price','Supplier','Date','Status'],DB.prod.map(p=>[esc(p.name),p.qty,taka(p.cost),esc(p.sup),p.date,p.qty<=p.min?`<span class="red">${t('Low Stock')}</span>`:'OK']))}`;
}
function addProd(){
  const n=g('i_name').trim(),q2=+g('i_qty'),c=+g('i_cost');
  if(!n||!(q2>0)||!(c>0)){err='Name, quantity and price are required';return render()}
  let p=DB.prod.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(p){p.qty+=q2;p.cost=c;p.sup=g('i_sup')||p.sup;p.date=g('i_date')}else DB.prod.push({id:uid(),name:n,qty:q2,cost:c,sup:g('i_sup'),date:g('i_date'),min:3});
  addTx('expense','Parts Purchase',q2*c,'Purchase: '+n+' × '+q2,'Cash',g('i_date'),'purch-'+uid(),'service');log('Stock purchase',n+' × '+q2);save();render();
}

/* ---------- Invoices ---------- */
function ivcP(){
  const R=[...(U()&&U()!=='training'?[]:DB.sp).map(p=>{const s=DB.stu.find(x=>x.id===p.sid);return[p.date,p.no,'Student',esc(s.name),p.amt,'sp',p.id]}),
    ...(U()&&U()!=='service'?[]:DB.jobs).flatMap(j=>j.pays.map(p=>[p.date,p.no,'Mobile Service',esc(j.cname),p.amt,'jp',p.id])),
    ...DB.sal.filter(x=>{const e=DB.emps.find(y=>y.id===x.eid);return !U()||e.dept===U()}).map(x=>{const e=DB.emps.find(y=>y.id===x.eid);return[x.date,x.no,'Salary',esc(e.name),x.amt,'sal',x.id]})].sort((a,b)=>b[0].localeCompare(a[0]));
  return `<h2>${t('Invoices')}</h2>`+tbl(['Date','No','Type','Name','Amount',''],R.map(r=>[r[0],r[1],r[2],r[3],taka(r[4]),`<button class="dk" onclick="doc('${r[5]}','${r[6]}')">${t('Print')} / PDF</button>`]));
}

    let tot=meas(base);if(tot>1180){base=base*1180/tot;tot=meas(base)}
    const gr=x.createLinearGradient(0,449,0,510);gr.addColorStop(0,'#f1d98f');gr.addColorStop(1,'#c79f47');
    x.fillStyle=gr;x.textAlign='left';
    let px=800-tot/2;
    chars.forEach(o=>{x.font='600 '+(o.big?base:base*0.86)+'px Cinzel,"Times New Roman",serif';if(o.ch!==' ')x.fillText(o.ch,px,509);px+=o.w+(o.ch===' '?0:3)});
  }
  const im=document.getElementById('certimg');if(im)im.src=c.toDataURL('image/jpeg',0.93);
}
async function certDlg(id){
  const s=DB.stu.find(x=>x.id===id);if(!s)return;
  const st=document.createElement('style');st.id='certpg';st.textContent='@media print{@page{size:A4 landscape;margin:0}}';document.head.appendChild(st);
  showDoc(`<div class="nopdf" style="padding:12px"><div class="form">${F('ct_name','Name','text',s.name)}${F('ct_bno','Batch No','text',s.bno||'')}${F('ct_year','Year','text',today().slice(0,4))}${F('ct_font','Batch/Year font','text','Cinzel',['Cinzel','Marcellus','Cormorant SC','Cormorant Garamond','Playfair Display'])}<button class="btn" onclick="certDraw()">Update certificate</button></div></div><img id="certimg" class="cert-img" alt="certificate">`,'certificate-'+s.code,'cert');
  certDraw();
}
function showDoc(html,name,cls){
  closeDoc();
  const nm=String(name).replace(/[^\w.-]/g,'_');
  const o=document.createElement('div');o.id='docov';
  o.innerHTML=`<div id="docbar"><button onclick="closeDoc()">← Back</button><button onclick="window.print()">🖨 Print</button><button class="pdf" onclick="makePdf('${nm}')">📄 PDF</button></div><div id="docbody" class="${cls||''}">${html}</div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';o.scrollTop=0;
}
function closeDoc(){const o=document.getElementById('docov');if(o)o.remove();const cp=document.getElementById('certpg');if(cp)cp.remove();document.body.style.overflow=''}
async function makePdf(name){
  const src=document.getElementById('docbody');if(!src)return;
  const btn=document.querySelector('#docbar .pdf');if(btn)btn.textContent='Please wait...';
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:0;top:0;width:'+(src.classList.contains('cert')?1123:700)+'px;z-index:-1;background:#fff';
  const cert=src.classList.contains('cert');
  const el=src.cloneNode(true);el.querySelectorAll('.nopdf').forEach(n=>n.remove());el.style.cssText=cert?'margin:0;max-width:none;width:1123px;height:791px;overflow:hidden;padding:0;box-sizing:border-box;background:#000':'margin:0;max-width:none;width:700px;padding:16px;box-sizing:border-box';
  host.appendChild(el);document.body.appendChild(host);
  const sy=window.scrollY,ov=document.body.style.overflow;
  try{
    if(!window.html2pdf)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    document.body.style.overflow='';window.scrollTo(0,0);
    const blob=await html2pdf().set({margin:cert?0:8,image:{type:'jpeg',quality:0.95},html2canvas:{scale:cert?1.6:(el.scrollHeight>2500?1.5:2),useCORS:true,backgroundColor:cert?'#000000':'#ffffff',scrollX:0,scrollY:0},jsPDF:cert?{unit:'px',format:[1123,791],orientation:'landscape',hotfixes:['px_scaling']}:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).outputPdf('blob');
    const f=new File([blob],name+'.pdf',{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name})}catch(e){if(!e||e.name!=='AbortError')throw e}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove()}
  }catch(e){alert('PDF could not be created. Use Print and choose Save as PDF.')}
  host.remove();document.body.style.overflow=ov;window.scrollTo(0,sy);
  if(btn)btn.textContent='📄 PDF';
}
function reportDoc(){
  const c=document.getElementById('app').cloneNode(true);
  c.querySelectorAll('.noprint,button,input,select').forEach(e=>e.remove());
  showDoc('<div class="h"><div><div class="l"><b>Repair</b> Xpert</div>Training and Service Center</div><div style="text-align:right">'+today()+'</div></div>'+c.innerHTML,'report-'+rp+'-'+today(),'rpt');
}
function doc(kind,id){
  let title,no2,date,party,lines,sum2;
  if(kind==='sp'){const p=DB.sp.find(x=>x.id===id),s=sSum(DB.stu.find(x=>x.id===p.sid)),upto=sum(s.ps.filter(x=>x.kind!=='Instrument'&&DB.sp.indexOf(x)<=DB.sp.indexOf(p)),x=>x.amt);
    title='STUDENT PAYMENT RECEIPT';no2=p.no;date=p.date;party=[['Student',s.name],['Student ID',s.code],['Phone',s.phone],['Batch',s.batch]];lines=[['Payment',p.kind+' ('+p.method+')'],['Amount received',taka(p.amt)]];sum2=[['Total course fee',taka(s.fee)],['Total paid',taka(upto)],['Remaining balance',taka(s.fee-upto),1]]}
  else if(kind==='jp'||kind==='job'){const j=kind==='job'?DB.jobs.find(x=>x.id===id):DB.jobs.find(x=>x.pays.some(p=>p.id===id)),p=j.pays.find(x=>x.id===id),paid=p?sum(j.pays.slice(0,j.pays.indexOf(p)+1),x=>x.amt):jPaid(j);
    title='SERVICE INVOICE';no2=p?p.no:'INV-'+j.no;date=p?p.date:j.date;party=[['Customer',j.cname],['Phone',j.phone],['Device',j.model],['IMEI',j.imei],['Job ID',j.no]];lines=[['Problem',j.problem],['Parts',taka(pc(j))],p?['Payment received',taka(p.amt)+' ('+p.method+')']:['Status',j.status]];sum2=[['Total amount',taka(j.price)],['Paid amount',taka(paid)],['Remaining balance',taka(j.price-paid),1]]}
  else{const x=DB.sal.find(y=>y.id===id),e=eSum(DB.emps.find(y=>y.id===x.eid)),upto=sum(DB.sal.filter(y=>y.eid===e.id&&y.month===x.month&&DB.sal.indexOf(y)<=DB.sal.indexOf(x)),y=>y.amt);
    title='SALARY RECEIPT';no2=x.no;date=x.date;party=[['Employee',e.name],['Designation',e.desig],['Phone',e.phone],['Month',x.month]];lines=[['Payment',x.kind+' ('+x.method+')'],['Amount paid',taka(x.amt)]];sum2=[['Salary + Bonus',taka(e.salary+e.bonus)],['Total paid this month',taka(upto)],['Remaining',taka(e.salary+e.bonus-upto),1]]}
  const row=r=>`<tr class="${r[2]?'d':''}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`;
  showDoc(`<div class="h"><div><div class="l"><b>Repair</b> Xpert</div>Training and Service Center</div><div style="text-align:right"><b>${title}</b><br>${no2}<br>${date}</div></div><table>${party.map(row).join('')}</table><table>${lines.map(row).join('')}</table><table>${sum2.map(row).join('')}</table><p style="margin-top:40px;font-size:12px;color:#777">Thank you. Computer generated document.</p>`,no2,'rc');
}

/* ---------- Reports ---------- */
function rng(p){const d=today();let s=d;if(p==='weekly'){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-6);s=x.toLocaleDateString('en-CA')}else if(p==='monthly')s=d.slice(0,7)+'-01';else if(p==='yearly')s=d.slice(0,4)+'-01-01';return[s,d]}
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function repTabs(){return `<span class="tabs">${['daily','weekly','monthly','yearly',...(U()==='service'?[]:['due'])].map(p=>`<button class="${rp===p?'on':''}" onclick="rp='${p}';render()">${t(p[0].toUpperCase()+p.slice(1))}</button>`).join(' ')}</span>`}
function dueRows(){
  const q=dq.trim().toLowerCase();
  return DB.stu.map(sSum).filter(x=>x.due>0&&(!dm||String(x.date).slice(0,7)===dm)&&(!q||(dbo?String(x.bno||'').toLowerCase()===q:(x.code+' '+x.name+' '+x.phone+' '+x.batch+' '+(x.bno||'')).toLowerCase().includes(q)))).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
}
function dueP(){
  const months=[...new Set(DB.stu.map(x=>String(x.date).slice(0,7)).filter(Boolean))].sort().reverse(),R=dueRows();
  const ml=m=>MN[+m.slice(5,7)-1]+' '+m.slice(0,4);
  return `<div class="row noprint"><h2 style="flex:1;margin:0">${t('Reports')}</h2>${repTabs()}<button class="dk" onclick="csv()">${t('Export CSV (Excel)')}</button><button class="dk" onclick="reportDoc()">PDF / ${t('Print')}</button></div>
  <div class="form noprint" style="margin:10px 0"><div><label>Admission month (due of this month's admissions)</label><select onchange="dm=this.value;render()"><option value="">All months</option>${months.map(m=>`<option value="${m}" ${dm===m?'selected':''}>${ml(m)}</option>`).join('')}</select></div><div><label>Search (Batch No / ID / Name / Phone)</label><input value="${esc(dq)}" onchange="dq=this.value;render()" onkeydown="if(event.key==='Enter')this.blur()"></div><label style="margin:0;font-size:14px;color:#111"><input type="checkbox" style="width:auto" ${dbo?'checked':''} onchange="dbo=this.checked;render()"> ${lang==='bn'?'শুধু ব্যাচ নাম্বার':'Batch No only'}</label></div>
  <div class="grid">${cd('Students with due',R.length)}${cd('Total due',taka(sum(R,x=>x.due)),'rd')}</div>
  <h3 style="margin-top:14px">Due List${dm?' - '+ml(dm):''}</h3>${tbl(['ID','Name','Phone','Batch','Batch No','Admission','Fee','Paid','Due'],R.map(x=>[esc(x.code),esc(x.name),esc(x.phone||''),esc(x.batch||''),esc(x.bno||''),x.date,taka(x.fee),taka(x.fp),'<b style="color:#d71920">'+taka(x.due)+'</b>']))}`;
}
 function repP(){
  if(rp==='due'&&U()!=='service')return dueP();
  const[f,to]=rng(rp),L=liveU().filter(x=>x.date>=f&&x.date<=to),inc=sum(L.filter(x=>x.type==='income'),x=>x.amt),exp=sum(L.filter(x=>x.type==='expense'),x=>x.amt);
  const by=(type)=>{const c={};L.filter(x=>x.type===type).forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);return Object.entries(c).map(([k,v])=>[k,taka(v)])};
  const S=DB.stu.map(sSum),J=DB.jobs,jd=J.filter(j=>j.delivered&&j.delivered>=f&&j.delivered<=to);
  return `<div class="row noprint"><h2 style="flex:1;margin:0">${t('Reports')}</h2>${repTabs()}<button class="dk" onclick="csv()">${t('Export CSV (Excel)')}</button><button class="dk" onclick="reportDoc()">PDF / ${t('Print')}</button></div>
  <p><b>${f}</b> → <b>${to}</b> (Asia/Dhaka)</p><div class="grid">${cd('Income',taka(inc))}${cd('Expense',taka(exp))}${cd('Profit & Loss',taka(inc-exp),inc-exp>=0?'dark':'rd')}</div>
  <h3>Income</h3>${tbl(['Category','Amount'],by('income'))}<h3 style="margin-top:14px">Expense</h3>${tbl(['Category','Amount'],by('expense'))}
  ${U()==='service'?'':'<h3 style="margin-top:14px">Student Report</h3>'}${U()==='service'?'':tbl(['New admissions','Total students','Total fees','Total paid','Total due'],[[S.filter(s=>s.date>=f&&s.date<=to).length,S.length,taka(sum(S,s=>s.fee)),taka(sum(S,s=>s.total)),taka(sum(S,s=>s.due))]])}
  ${U()==='training'?'':'<h3 style="margin-top:14px">Service Report</h3>'}${U()==='training'?'':tbl(['Received','Delivered','Pending','Profit (delivered)'],[[J.filter(j=>j.date>=f&&j.date<=to).length,jd.length,J.filter(j=>j.status!=='Delivered').length,taka(sum(jd,jProfit))]])}
  <h3 style="margin-top:14px">Employee Salary Report</h3>${tbl(['Name','Paid in period'],DB.emps.filter(e=>!U()||e.dept===U()).map(e=>[esc(e.name),taka(sum(DB.sal.filter(x=>x.eid===e.id&&x.date>=f&&x.date<=to),x=>x.amt))]))}
  <p class="warn" style="margin-top:12px">Parts cost inside a job is used only for job profit. The business expense is counted once, when parts are purchased.</p>`;
}
function csv(){
  const[f,to]=rng(rp),rows=rp==='due'?[['ID','Name','Phone','Batch','Batch No','Admission','Fee','Paid','Due'],...dueRows().map(x=>[x.code,x.name,x.phone||'',x.batch||'',x.bno||'',x.date,x.fee,x.fp,x.due])]:[['Date','Type','Category','Description','Method','Amount (BDT)'],...liveU().filter(x=>x.date>=f&&x.date<=to).map(x=>[x.date,x.type,x.cat,x.desc,x.method,x.amt])];
  const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='report-'+rp+'.csv';a.click();
}

/* ---------- Users & Security ---------- */
function usrP(){
  return `<h2>${t('Users & Security')}</h2><div class="card"><b>Current role: ${role}</b> <small class="g">(change from the top right box)</small></div>
  ${tbl(['Permission','Admin','Employee'],[['Add students / jobs / payments','✔','✔'],['Change job status, use parts','✔','✔'],['Add employee, edit job price','✔','✖'],['Void financial record','✔','✖'],['View Activity Log, Backup, Restore','✔','✖'],['Permanent delete','✖','✖']])}
  ${role==='admin'?lockForm():''}<div class="row" style="margin-top:12px"><button class="btn" onclick="backup()">${t('Backup')} (JSON)</button><label class="dk" style="margin:0;cursor:pointer">${t('Restore')}<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label><button class="dk" onclick="resetDemo()">Load sample data (empty system only)</button></div>
  <h3>${t('Activity Log')}</h3>`+(role==='admin'?tbl(['Time','Role','Action','Detail'],DB.log.slice(0,60).map(l=>[l.t,esc((l.u||'')+' ('+l.role+')'),l.a,esc(l.d)])):'<div class="warn">Admin only</div>');
}
function backup(){if(!adm())return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='repair-xpert-backup-'+today()+'.json';a.click();log('Backup downloaded')}
function restore(f){if(!adm()||!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);log('Data restored');render()}catch(e){err='Invalid backup file';render()}};r.readAsText(f)}
function resetDemo(){if(!adm())return;if(DB.tx.length||DB.stu.length||DB.jobs.length||DB.emps.length){alert('System is not empty. Sample data can only be loaded into an empty system.');return}if(confirm('Load sample data?')){seed();render()}}

boot();
let _day=today();setInterval(()=>{try{if(today()!==_day){_day=today();if(typeof DB!=='undefined'&&DB&&sec!==undefined)render()}}catch(e){}},60000);
</script>
