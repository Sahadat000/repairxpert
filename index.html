<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Bengali',system-ui,Arial,sans-serif;background:#f4f4f5;color:#111}

header b span{color:#d71920}
header select,.lang{background:#111;color:#fff;border:1px solid #555;padding:6px 10px;border-radius:6px;cursor:pointer}
nav{background:#111;display:flex;overflow-x:auto;white-space:nowrap}

main{padding:14px;max-width:1000px;margin:auto}
h2{margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:14px;margin-bottom:10px}
.card.dark{background:#000;color:#fff;border-color:#000}
.card.rd{background:#d71920;color:#fff;border-color:#d71920}
.card small{color:#777;display:block}.card.dark small,.card.rd small{color:#ddd}
.card h3{margin:4px 0 0;font-size:21px}
input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:6px;width:100%;font-size:14px;background:#fff}
.btn{background:#d71920;color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.dk{background:#000;color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:#555;display:block;margin-bottom:2px}
.red{color:#d71920;font-weight:700}.green{color:#16a34a;font-weight:700}
.top{display:flex;justify-content:space-between;gap:8px;cursor:pointer;flex-wrap:wrap}
small.g{color:#777}
.hist{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:6px 0;font-size:14px;gap:8px}
.err{background:#fee2e2;color:#b91c1c;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.warn{background:#fff7ed;color:#c2410c;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eee}
.b0{background:#fde68a}.b1{background:#bfdbfe}.b2{background:#c7f9cc}.b3{background:#ddd}
.tabs button{background:#fff;border:1px solid #ccc;padding:7px 14px;border-radius:6px;cursor:pointer}
.tabs button.on{background:#d71920;color:#fff;border-color:#d71920}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th{background:#000;color:#fff;text-align:left;padding:8px;white-space:nowrap}td{padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
hr{border:0;border-top:1px solid #eee;margin:12px 0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}}

<body>
<header>
  <div><b><span>Repair</span> Xpert <small style="font-weight:400;font-size:10px">v5</small></b> <button class="lang" id="homeBtn" style="display:none" onclick="goHome()">⌂ Home</button> <span id="secName" class="badge" style="display:none;background:#d71920;color:#fff"></span></div>
  <div><span id="who" style="font-size:13px;margin-right:6px"></span><button class="lang" id="refBtn" style="display:none" onclick="refresh()">⟳</button> <button class="lang" id="logoutBtn" style="display:none" onclick="logout()">Logout</button> <span id="sync" style="font-size:12px;color:#aaa"></span>

<script>
const BN={'Dashboard':'ড্যাশবোর্ড','Students':'স্টুডেন্ট','Service Jobs':'সার্ভিস জব','Service Accounting':'সার্ভিস হিসাব','Employees':'কর্মচারী','Income':'আয়','Expenses':'খরচ','Inventory':'ইনভেন্টরি','Invoices':'ইনভয়েস','Reports':'রিপোর্ট','Users & Security':'ইউজার ও সিকিউরিটি',
'Total Students':'মোট স্টুডেন্ট','Morning':'সকাল','Evening':'সন্ধ্যা','Total Student Fees':'মোট কোর্স ফি','Total Student Payments':'মোট জমা','Total Student Due':'মোট বকেয়া',"Today's Service Jobs":'আজকের সার্ভিস জব','Pending Jobs':'পেন্ডিং জব','Delivered Jobs':'ডেলিভারি হয়েছে','Monthly Income':'মাসিক আয়','Monthly Expenses':'মাসিক খরচ','Net Profit':'নিট লাভ','Employee Salary Due':'কর্মচারী বেতন বাকি','Customer Due':'কাস্টমার বাকি',
'Name':'নাম','Phone':'ফোন','Address':'ঠিকানা','Batch':'ব্যাচ','Course Fee':'কোর্স ফি','Date':'তারিখ','Amount':'টাকা','Method':'মাধ্যম','Save':'সংরক্ষণ','Add Payment':'পেমেন্ট যোগ','Payment History':'পেমেন্ট হিস্টরি','Receipt':'রসিদ','Invoice':'ইনভয়েস','Print':'প্রিন্ট','Status':'স্ট্যাটাস','Technician':'টেকনিশিয়ান','Problem':'সমস্যা','Parts Cost':'পার্টস খরচ','Selling Price':'বিক্রয় মূল্য','Profit':'লাভ','Designation':'পদবী','Salary':'বেতন','Bonus':'বোনাস','Advance':'অগ্রিম','Remaining':'বাকি','Category':'ক্যাটাগরি','Description':'বিবরণ','Add':'যোগ করুন','Supplier':'সরবরাহকারী','Quantity':'পরিমাণ','Purchase Price':'ক্রয়মূল্য','Low Stock':'স্টক কম','Activity Log':'অ্যাক্টিভিটি লগ','Backup':'ব্যাকআপ','Restore':'রিস্টোর',
'Daily':'দৈনিক','Weekly':'সাপ্তাহিক','Monthly':'মাসিক','Yearly':'বার্ষিক','Received':'গ্রহণ করা হয়েছে','In Progress':'চলমান','Ready for Delivery':'ডেলিভারির জন্য প্রস্তুত','Delivered':'ডেলিভারি হয়েছে','Cash':'নগদ','Pending':'পেন্ডিং','Delivery History':'ডেলিভারি হিস্টরি','New Admission':'নতুন ভর্তি','Receive Job':'জব গ্রহণ','Search name / phone / ID':'নাম / ফোন / আইডি খুঁজুন','All batches':'সব ব্যাচ','Due only':'শুধু বকেয়া','Due':'বাকি','Paid':'জমা','No data':'কোনো তথ্য নেই','Total':'মোট','Expense':'খরচ','Export CSV (Excel)':'এক্সেল এক্সপোর্ট','Payment type':'পেমেন্টের ধরন','Phone Model':'ফোন মডেল','Estimated Cost':'আনুমানিক খরচ','Additional Expense':'অতিরিক্ত খরচ','Training':'ট্রেনিং','Photos':'ছবি','Batch':'ব্যাচ','Date':'তারিখ','Course Fee':'কোর্স ফি','Student Photo (optional)':'স্টুডেন্টের ছবি (ঐচ্ছিক)','Change photo':'ছবি পরিবর্তন','Add student photo':'স্টুডেন্টের ছবি যোগ করুন','Add Photo':'ছবি যোগ করুন','Caption (optional)':'ক্যাপশন (ঐচ্ছিক)','Service':'সার্ভিস','Common / Admin':'কমন / অ্যাডমিন','Department':'বিভাগ','training':'ট্রেনিং','service':'সার্ভিস','common':'কমন','Overall':'সামগ্রিক'};
let lang='en',page='dash',role='admin',sec=null,unl={},jt='pending',rp='monthly',sf=0,jf=0,ef=0,pf=0,ex=null,q='',bf='',dueOnly=false,err='';
const t=k=>lang==='bn'&&BN[k]?BN[k]:k;
const taka=n=>'৳ '+Number(n||0).toLocaleString('en-IN');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const g=id=>document.getElementById(id).value;
const F=(id,l,type='text',v='',o=null)=>`<div><label>${t(l)}</label>${o?`<select id="${id}">${o.map(x=>`<option value="${esc(x)}" ${x==v?'selected':''}>${t(x)}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" value="${esc(v)}">`}</div>`;
const METHODS=['Cash','bKash','Nagad','Rocket','Bank'];
const STAT=['Received','In Progress','Ready for Delivery','Delivered'];
const SN={training:[['dash','Dashboard'],['stu','Students'],['emp','Employees'],['inc','Income'],['exp','Expenses'],['ivc','Invoices'],['rep','Reports']],
service:[['dash','Dashboard'],['job','Service Jobs'],['acc','Service Accounting'],['inv','Inventory'],['emp','Employees'],['inc','Income'],['exp','Expenses'],['ivc','Invoices'],['rep','Reports']],
home:[['dash','Dashboard']],
common:[['dash','Dashboard'],['emp','Employees'],['inc','Income'],['exp','Expenses'],['ivc','Invoices'],['rep','Reports'],['usr','Users & Security']]};
const SECN={training:'Training',service:'Service',common:'Common / Admin',home:'Dashboard',admin:'Common / Admin'};
const adm=()=>{if(role!=='admin'){alert('Admin permission required');return false}return true};

let DB,sb=null,ver=0,saving=false,pending=false,st=null,me={name:'',role:'employee'},DEMO=false;
let SB_URL='PASTE_SUPABASE_URL',SB_KEY='PASTE_ANON_KEY';
try{if(SB_URL.startsWith('PASTE')){SB_URL=localStorage.getItem('sbu')||SB_URL;SB_KEY=localStorage.getItem('sbk')||SB_KEY}}catch(e){}
const emptyDB=()=>({c:{stu:0,job:0,n:0},stu:[],sp:[],jobs:[],emps:[],sal:[],tx:[],prod:[],log:[]});
const setSync=m=>{const e=document.getElementById('sync');if(e)e.textContent=m};
function save(){if(DEMO)return;setSync('saving...');clearTimeout(st);st=setTimeout(remoteSave,250)}
async function remoteSave(){
  if(saving){pending=true;return}
  saving=true;
  const{data,error}=await sb.from('app_state').update({data:DB,version:ver+1,updated_at:new Date().toISOString()}).eq('id',1).eq('version',ver).select('version');
  saving=false;
  if(error){err='Save failed: '+error.message;setSync('not saved');render();return}
  if(!data||!data.length){alert('Another device saved changes first. Latest data is loaded now. Please enter your last change again.');await loadRemote();render();return}
  ver=data[0].version;setSync('saved ✔');
  if(pending){pending=false;remoteSave()}
}
async function loadRemote(){
  const{data,error}=await sb.from('app_state').select('data,version').eq('id',1).single();
  if(error){document.getElementById('app').innerHTML='<div class="err">'+esc(error.message)+'</div>';return false}
  ver=data.version;DB=data.data&&data.data.c?data.data:emptyDB();return true;
}
async function refresh(){if(await loadRemote()){render();setSync('updated ✔')}}
function startPoll(){setInterval(async()=>{
  if(saving||pending)return;const a=document.activeElement;if(a&&['INPUT','SELECT'].includes(a.tagName))return;
  const{data}=await sb.from('app_state').select('version').eq('id',1).single();
  if(data&&data.version>ver){await loadRemote();render();setSync('updated ✔')}
},30000)}
function showLogin(sg){
  document.getElementById('nav').innerHTML='';
  document.getElementById('app').innerHTML=`<div class="card" style="max-width:360px;margin:30px auto"><h2><span class="red">Repair</span> Xpert</h2><div class="form" style="grid-template-columns:1fr">${sg?F('l_name','Name'):''}${F('l_email','Email','email')}${F('l_pw','Password','password')}<button class="btn" onclick="auth(${sg?1:0})">${sg?'Create account':'Login'}</button></div><p><a href="#" onclick="showLogin(${sg?0:1});return false">${sg?'Have an account? Login':'First time? Create admin account'}</a></p><div id="lmsg"></div></div>`;
}
function lmsg(m){const e=document.getElementById('lmsg');if(e)e.innerHTML='<div class="err">'+esc(m)+'</div>'}
async function auth(sg){
  const em=g('l_email'),pw=g('l_pw');
  const r=sg?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:g('l_name')}}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error)return lmsg(r.error.message);
  if(!r.data.session)return lmsg('Account created. Confirm your email, then login.');
  await start(r.data.user);
}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(u){
  const{data:p}=await sb.from('profiles').select('*').eq('id',u.id).single();
  me={name:(p&&p.full_name)||u.email,role:(p&&p.role)||'employee'};role=me.role;
  if(!(await loadRemote()))return;
  document.getElementById('who').textContent=me.name+' ('+role+')';
  document.getElementById('logoutBtn').style.display='';document.getElementById('refBtn').style.display='';
  render();startPoll();
}
async function boot(){
  if(SB_URL.startsWith('PASTE')){
    document.getElementById('app').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>Connect database</h2><div class="form" style="grid-template-columns:1fr">${F('c_url','Supabase Project URL')}${F('c_key','Supabase anon key')}<button class="btn" onclick="saveCfg()">Save</button><button class="dk" onclick="demoMode()">Try demo (no database, nothing is saved)</button></div></div>`;return;
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin(0);
  await start(session.user);
}
function demoMode(){
  DEMO=true;role='admin';me={name:'Demo Admin',role:'admin'};DB=emptyDB();seed();
  document.getElementById('who').textContent='Demo mode (not saved)';
  render();
}
function saveCfg(){try{localStorage.setItem('sbu',g('c_url').trim());localStorage.setItem('sbk',g('c_key').trim())}catch(e){}location.reload()}
function log(a,d){DB.log.unshift({t:new Date().toLocaleString('en-GB',{timeZone:'Asia/Dhaka'}),role,u:me.name,a,d:d||''});save()}
function no(p){return p+'-'+String(++DB.c.n).padStart(5,'0')}
function addTx(type,cat,amt,desc,method,date,src,unit){DB.tx.push({id:uid(),type,cat,amt:+amt,desc,method,date,src:src||null,unit:unit||'common',void:false})}
function stuPay(sid,kind,amt,method,date){const s=DB.stu.find(x=>x.id===sid),id=uid(),n=no('RCPT');DB.sp.push({id,sid,kind,amt:+amt,method,date,no:n});addTx('income',kind==='Admission'?'Student Admission Fees':kind==='Instrument'?'Instrument Sales':'Student Installments',amt,kind+' - '+s.name,method,date,id,'training');log('Student payment',n+' '+s.name+' '+taka(amt))}
function jobPay(jid,amt,method,date){const j=DB.jobs.find(x=>x.id===jid),id=uid(),n=no('JR');j.pays.push({id,amt:+amt,method,date,no:n});addTx('income','Mobile Repairing Income',amt,j.no+' - '+j.cname,method,date,id,'service');log('Job payment',n+' '+j.no+' '+taka(amt))}
function salPay(eid,kind,amt,method,date){const e=DB.emps.find(x=>x.id===eid),id=uid(),n=no('SAL');DB.sal.push({id,eid,kind,amt:+amt,method,date,no:n,month:date.slice(0,7)});addTx('expense','Employee Salary',amt,kind+' - '+e.name,method,date,id,e.dept||'common');log('Salary payment',n+' '+e.name+' '+taka(amt))}

function seed(){
  const d=today();
  DB={c:{stu:2,job:2,n:0},stu:[],sp:[],jobs:[],emps:[],sal:[],tx:[],prod:[],log:[]};
  DB.stu=[{id:'s1',code:'RE-26-0001',name:'Rahim Uddin',phone:'01711000000',addr:'Dhaka',batch:'Morning',fee:12000,date:d},{id:'s2',code:'RE-26-0002',name:'করিম হোসেন',phone:'01811000000',addr:'Mirpur',batch:'Evening',fee:10000,date:d}];
  DB.emps=[{id:'e1',name:'Sabbir Ahmed',phone:'01911000000',desig:'Technician',dept:'service',join:'2024-01-01',salary:15000,bonus:0},{id:'e2',name:'Nasrin Akter',phone:'01611000000',desig:'Instructor',dept:'training',join:'2024-03-01',salary:12000,bonus:1000}];
  DB.prod=[{id:'p1',name:'iPhone 11 Display',qty:5,cost:2500,sup:'Mobile Parts BD',date:d,min:3},{id:'p2',name:'Samsung A12 Battery',qty:2,cost:450,sup:'Gadget House',date:d,min:3},{id:'p3',name:'Charging Port',qty:19,cost:60,sup:'Mobile Parts BD',date:d,min:5}];
  DB.jobs=[
   {id:'j1',no:'JOB-26-0001',cname:'Anwar Hossain',phone:'01511000000',model:'Samsung A12',imei:'356789012345678',problem:'Battery drains fast',tech:'Sabbir Ahmed',date:d,est:900,price:1000,extra:0,status:'In Progress',delivered:'',parts:[],pays:[]},
   {id:'j2',no:'JOB-26-0002',cname:'Mitu Akter',phone:'01311000000',model:'Redmi Note 10',imei:'867530912345678',problem:'Charging port broken',tech:'Sabbir Ahmed',date:d,est:500,price:600,extra:20,status:'Delivered',delivered:d,parts:[{pid:'p3',name:'Charging Port',qty:1,cost:60}],pays:[]}];
  stuPay('s1','Admission',5000,'Cash',d);stuPay('s2','Admission',3000,'bKash',d);
  jobPay('j2',600,'Cash',d);jobPay('j1',300,'bKash',d);
  salPay('e1','Advance',3000,'Cash',d);
  addTx('expense','Shop Rent',8000,'Monthly shop rent','Cash',d,null,'common');
  addTx('expense','Internet Bill',800,'Broadband','bKash',d,null,'common');
  addTx('income','Other Income',500,'Old phone sale','Cash',d,null,'service');addTx('expense','Facebook Marketing',1500,'Admission ads','bKash',d,null,'training');
  log('Demo data loaded');
}

const sSum=s=>{const ps=DB.sp.filter(p=>p.sid===s.id),fp=ps.filter(p=>p.kind!=='Instrument').reduce((a,p)=>a+p.amt,0),ins=ps.filter(p=>p.kind==='Instrument').reduce((a,p)=>a+p.amt,0);return{...s,ps,fp,ins,total:fp+ins,due:s.fee-fp}};
const pc=j=>j.parts.reduce((a,p)=>a+p.qty*p.cost,0),jPaid=j=>j.pays.reduce((a,p)=>a+p.amt,0),jProfit=j=>j.price-pc(j)-j.extra,jDue=j=>j.price-jPaid(j);
const eSum=e=>{const m=today().slice(0,7),h=DB.sal.filter(x=>x.eid===e.id),paid=h.filter(x=>x.month===m).reduce((a,x)=>a+x.amt,0);return{...e,paid,rem:e.salary+e.bonus-paid,hist:h}};
const live=()=>DB.tx.filter(x=>!x.void);const U=()=>(sec==='common'||sec==='home')?null:sec;const liveU=()=>live().filter(x=>!U()||x.unit===U());
const sumTx=(type,from,to,u)=>live().filter(x=>x.type===type&&(!u||x.unit===u)&&(!from||x.date>=from)&&(!to||x.date<=to)).reduce((a,x)=>a+x.amt,0);
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${t(x)}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}">${t('No data')}</td></tr>`}</table></div>`;
const cd=(l,v,c)=>`<div class="card ${c||''}"><small>${t(l)}</small><h3>${v}</h3></div>`;

function render(){
  const hb=document.getElementById('homeBtn'),sn=document.getElementById('secName');
  hb.style.display=sec?'':'none';sn.style.display=sec?'':'none';if(sec)sn.textContent=t(SECN[sec]);
  document.getElementById('nav').innerHTML=(sec?SN[sec]:[]).map(([k,l])=>`<button class="${page===k?'on':''}" onclick="page='${k}';ex=null;render()">${t(l)}</button>`).join('');
  const P={dash:()=>(sec==='common'||sec==='home')?dashP():secDash(),stu:stuP,job:jobP,acc:accP,emp:empP,inc:()=>txP('income'),exp:()=>txP('expense'),inv:invP,ivc:ivcP,rep:repP,usr:usrP};
  document.getElementById('app').innerHTML=(err?`<div class="err">${esc(err)}</div>`:'')+(sec?P[page]():homeP());err='';

function shrink(file,m){m=m||700;return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.65))};i.src=r.result};r.readAsDataURL(file)})}

function addJob(){
  if(!g('j_name').trim()||!DB.emps.length)return;
  const e=+g('j_est')||0,j={id:uid(),no:'JOB-'+today().slice(2,4)+'-'+String(++DB.c.job).padStart(4,'0'),cname:g('j_name'),phone:g('j_phone'),model:g('j_model'),imei:g('j_imei'),problem:g('j_prob'),tech:g('j_tech'),date:g('j_date'),est:e,price:e,extra:0,status:'Received',delivered:'',parts:[],pays:[]};
  DB.jobs.unshift(j);log('Job received',j.no+' '+j.cname);jf=0;save();render();
}
function setStat(id,v){const j=DB.jobs.find(x=>x.id===id);j.status=v;j.delivered=v==='Delivered'?today():'';log('Job status',j.no+' → '+v);ex=null;save();render()}
function updJob(id){if(!adm())return;const j=DB.jobs.find(x=>x.id===id);j.price=+g('u_price')||0;j.extra=+g('u_extra')||0;log('Job price edited',j.no+' price '+taka(j.price)+' extra '+taka(j.extra));save();render()}
function addPart(id){
  const j=DB.jobs.find(x=>x.id===id),p=DB.prod.find(x=>x.id===g('pt_p')),q2=+g('pt_q');
  if(!p||!(q2>0))return;
  if(q2>p.qty){err='Not enough stock ('+p.qty+' left)';return render()}
  p.qty-=q2;j.parts.push({pid:p.id,name:p.name,qty:q2,cost:p.cost});log('Part used',j.no+' '+p.name+' × '+q2);save();render();
}
function addJP(id){
  const j=DB.jobs.find(x=>x.id===id),a=+g('jp_amt');
  if(!(a>0)){err='Enter a valid amount';return render()}
  if(a>jDue(j)){err='Amount is more than due ('+taka(jDue(j))+')';return render()}
  jobPay(id,a,g('jp_m'),today());save();render();
}

/* ---------- Service Accounting ---------- */
function accP(){
  const d=today(),J=DB.jobs,techs=[...new Set(J.map(j=>j.tech))];
  return `<h2>${t('Service Accounting')}</h2><div class="grid">${cd('Daily Received Jobs',J.filter(j=>j.date===d).length,'dark')}${cd('Daily Delivered Jobs',J.filter(j=>j.delivered===d).length)}${cd('Pending Jobs',J.filter(j=>j.status!=='Delivered').length)}
  ${cd('Selling Price',taka(sum(J,j=>j.price)))}${cd('Parts Cost',taka(sum(J,pc)))}${cd('Additional Expense',taka(sum(J,j=>j.extra)))}${cd('Profit',taka(sum(J,jProfit)),'dark')}${cd('Customer Due',taka(sum(J,j=>Math.max(jDue(j),0))),'rd')}</div>
  <h3>Technician-wise Report</h3>${tbl(['Technician','Jobs','Delivered','Selling Price','Parts Cost','Additional Expense','Profit'],techs.map(n=>{const x=J.filter(j=>j.tech===n);return[esc(n),x.length,x.filter(j=>j.status==='Delivered').length,taka(sum(x,j=>j.price)),taka(sum(x,pc)),taka(sum(x,j=>j.extra)),`<b>${taka(sum(x,jProfit))}</b>`]}))}
  <h3 style="margin-top:16px">Customer Payment History</h3>${tbl(['Date','Receipt','Job','Name','Method','Amount'],J.flatMap(j=>j.pays.map(p=>[p.date,p.no,j.no,esc(j.cname),p.method,taka(p.amt)])))}`;
}

/* ---------- Employees ---------- */
function empP(){
  let h=`<div class="row"><h2 style="flex:1;margin:0">${t('Employees')}</h2><button class="btn" onclick="ef=!ef;render()">+ ${t('Add')}</button></div>`;
  if(ef)h+=`<div class="card"><div class="form">${F('e_name','Name')}${F('e_phone','Phone')}${F('e_des','Designation')}${F('e_join','Date','date',today())}${F('e_sal','Salary','number')}${F('e_bon','Bonus','number','0')}${F('e_dept','Department','text',U()||'service',['training','service'])}<button class="btn" onclick="addEmp()">${t('Save')}</button></div></div>`;
  DB.emps.filter(e=>!U()||e.dept===U()).map(eSum).forEach(e=>{
    h+=`<div class="card"><div class="top" onclick="tg('${e.id}')"><div><b>${esc(e.name)}</b> <small class="g">${esc(e.desig)} · ${e.dept||''}</small><br><small class="g">${esc(e.phone)} · joined ${e.join}</small></div><div style="text-align:right">${t('Salary')} ${taka(e.salary)} + ${t('Bonus')} ${taka(e.bonus)}<br>${t('Paid')}: ${taka(e.paid)} · <span class="${e.rem>0?'red':'green'}">${t('Remaining')}: ${taka(e.rem)}</span></div></div>`;
    if(ex===e.id)h+=`<hr><div class="form">${F('sp_k','Payment type','text','Salary',['Salary','Advance','Bonus'])}${F('sp_a','Amount','number',Math.max(e.rem,0)||'')}${F('sp_m','Method','text','Cash',METHODS)}<button class="btn" onclick="paySal('${e.id}')">Confirm Payment</button></div><p><b>${t('Payment History')}</b></p>`+(e.hist.map(x=>`<div class="hist"><div>${x.date} · ${x.kind} · ${x.method}<br><small class="g">${x.no}</small></div><div><b>${taka(x.amt)}</b> <button class="dk" onclick="doc('sal','${x.id}')">${t('Receipt')}</button></div></div>`).join('')||t('No data'));
    h+='</div>';
  });
  return h;
}
function addEmp(){if(!adm()||!g('e_name').trim())return;const e={id:uid(),name:g('e_name'),phone:g('e_phone'),desig:g('e_des'),dept:g('e_dept'),join:g('e_join'),salary:+g('e_sal')||0,bonus:+g('e_bon')||0};DB.emps.push(e);log('New employee',e.name);ef=0;save();render()}
function paySal(id){
  const a=+g('sp_a'),e=eSum(DB.emps.find(x=>x.id===id));
  if(!(a>0)){err='Enter a valid amount';return render()}
  if(a>e.rem){err='Amount is more than remaining ('+taka(e.rem)+')';return render()}
  if(!confirm('Confirm payment of '+taka(a)+' to '+e.name+'?'))return;
  salPay(id,g('sp_k'),a,g('sp_m'),today());save();render();
}

/* ---------- Income / Expense ---------- */
function txP(type){
  const cats=type==='income'?(sec==='training'?['Student Admission Fees','Student Installments','Instrument Sales','Other Income']:sec==='service'?['Mobile Repairing Income','Other Income']:['Student Admission Fees','Student Installments','Instrument Sales','Mobile Repairing Income','Other Income']):['Shop Rent','Employee Salary','Parts Purchase','Electricity Bill','Internet Bill','Facebook Marketing','Other Expenses'];
  const L=liveU().filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date));
  return `<h2>${t(type==='income'?'Income':'Expenses')}: ${taka(sum(L,x=>x.amt))}</h2><div class="grid">${cats.map(c=>cd(c,taka(sum(L.filter(x=>x.cat===c),x=>x.amt)))).join('')}</div>
  <div class="card"><div class="form">${F('t_cat','Category','text','',cats)}${F('t_amt','Amount','number')}${F('t_desc','Description')}${F('t_m','Method','text','Cash',METHODS)}${F('t_date','Date','date',today())}${sec==='common'?F('t_unit','Department','text','common',['common','training','service']):''}<button class="btn" onclick="addT('${type}')">${t('Add')}</button></div></div>
  ${tbl(['Date','Category','Description','Method','Amount',''],L.map(x=>[x.date,x.cat,esc(x.desc),x.method,'<b>'+taka(x.amt)+'</b>',x.src?'<small class="g">auto</small>':`<button class="dk" onclick="voidT('${x.id}')">Void</button>`]))}`;
}
function addT(type){const a=+g('t_amt');if(!(a>0)||!g('t_desc').trim()){err='Amount and description are required';return render()}addTx(type,g('t_cat'),a,g('t_desc'),g('t_m'),g('t_date'),null,sec==='common'?g('t_unit'):sec);log('Manual '+type,g('t_cat')+' '+taka(a));save();render()}
function voidT(id){if(!adm())return;const x=DB.tx.find(y=>y.id===id);if(!confirm('Void this record? It stays in the Activity Log.'))return;x.void=true;log('Record voided',x.cat+' '+taka(x.amt)+' '+x.desc);save();render()}

/* ---------- Inventory ---------- */
function invP(){
  const low=DB.prod.filter(p=>p.qty<=p.min);
  return `<h2>${t('Inventory')}</h2>${low.length?`<div class="warn">⚠ ${t('Low Stock')}: ${low.map(p=>esc(p.name)+' ('+p.qty+')').join(', ')}</div>`:''}
  <div class="card"><div class="form">${F('i_name','Name')}${F('i_qty','Quantity','number')}${F('i_cost','Purchase Price','number')}${F('i_sup','Supplier')}${F('i_date','Date','date',today())}<button class="btn" onclick="addProd()">${t('Add')} / Restock</button></div><small class="g">Same name = restock. Purchase is saved once as "Parts Purchase" expense.</small></div>
  ${tbl(['Name','Quantity','Purchase Price','Supplier','Date','Status'],DB.prod.map(p=>[esc(p.name),p.qty,taka(p.cost),esc(p.sup),p.date,p.qty<=p.min?`<span class="red">${t('Low Stock')}</span>`:'OK']))}`;
}
function addProd(){
  const n=g('i_name').trim(),q2=+g('i_qty'),c=+g('i_cost');
  if(!n||!(q2>0)||!(c>0)){err='Name, quantity and price are required';return render()}
  let p=DB.prod.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(p){p.qty+=q2;p.cost=c;p.sup=g('i_sup')||p.sup;p.date=g('i_date')}else DB.prod.push({id:uid(),name:n,qty:q2,cost:c,sup:g('i_sup'),date:g('i_date'),min:3});
  addTx('expense','Parts Purchase',q2*c,'Purchase: '+n+' × '+q2,'Cash',g('i_date'),'purch-'+uid(),'service');log('Stock purchase',n+' × '+q2);save();render();
}

/* ---------- Invoices ---------- */
function ivcP(){
  const R=[...(U()&&U()!=='training'?[]:DB.sp).map(p=>{const s=DB.stu.find(x=>x.id===p.sid);return[p.date,p.no,'Student',esc(s.name),p.amt,'sp',p.id]}),
    ...(U()&&U()!=='service'?[]:DB.jobs).flatMap(j=>j.pays.map(p=>[p.date,p.no,'Mobile Service',esc(j.cname),p.amt,'jp',p.id])),
    ...DB.sal.filter(x=>{const e=DB.emps.find(y=>y.id===x.eid);return !U()||e.dept===U()}).map(x=>{const e=DB.emps.find(y=>y.id===x.eid);return[x.date,x.no,'Salary',esc(e.name),x.amt,'sal',x.id]})].sort((a,b)=>b[0].localeCompare(a[0]));
  return `<h2>${t('Invoices')}</h2>`+tbl(['Date','No','Type','Name','Amount',''],R.map(r=>[r[0],r[1],r[2],r[3],taka(r[4]),`<button class="dk" onclick="doc('${r[5]}','${r[6]}')">${t('Print')} / PDF</button>`]));
}
function doc(kind,id){
  let title,no2,date,party,lines,sum2;
  if(kind==='sp'){const p=DB.sp.find(x=>x.id===id),s=sSum(DB.stu.find(x=>x.id===p.sid)),upto=sum(s.ps.filter(x=>x.kind!=='Instrument'&&DB.sp.indexOf(x)<=DB.sp.indexOf(p)),x=>x.amt);
    title='STUDENT PAYMENT RECEIPT';no2=p.no;date=p.date;party=[['Student',s.name],['Student ID',s.code],['Phone',s.phone],['Batch',s.batch]];lines=[['Payment',p.kind+' ('+p.method+')'],['Amount received',taka(p.amt)]];sum2=[['Total course fee',taka(s.fee)],['Total paid',taka(upto)],['Remaining balance',taka(s.fee-upto),1]]}
  else if(kind==='jp'||kind==='job'){const j=kind==='job'?DB.jobs.find(x=>x.id===id):DB.jobs.find(x=>x.pays.some(p=>p.id===id)),p=j.pays.find(x=>x.id===id),paid=p?sum(j.pays.slice(0,j.pays.indexOf(p)+1),x=>x.amt):jPaid(j);
    title='SERVICE INVOICE';no2=p?p.no:'INV-'+j.no;date=p?p.date:j.date;party=[['Customer',j.cname],['Phone',j.phone],['Device',j.model],['IMEI',j.imei],['Job ID',j.no]];lines=[['Problem',j.problem],['Parts',taka(pc(j))],p?['Payment received',taka(p.amt)+' ('+p.method+')']:['Status',j.status]];sum2=[['Total amount',taka(j.price)],['Paid amount',taka(paid)],['Remaining balance',taka(j.price-paid),1]]}
  else{const x=DB.sal.find(y=>y.id===id),e=eSum(DB.emps.find(y=>y.id===x.eid)),upto=sum(DB.sal.filter(y=>y.eid===e.id&&y.month===x.month&&DB.sal.indexOf(y)<=DB.sal.indexOf(x)),y=>y.amt);
    title='SALARY RECEIPT';no2=x.no;date=x.date;party=[['Employee',e.name],['Designation',e.desig],['Phone',e.phone],['Month',x.month]];lines=[['Payment',x.kind+' ('+x.method+')'],['Amount paid',taka(x.amt)]];sum2=[['Salary + Bonus',taka(e.salary+e.bonus)],['Total paid this month',taka(upto)],['Remaining',taka(e.salary+e.bonus-upto),1]]}
  const row=r=>`<tr class="${r[2]?'d':''}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`;
  const w=window.open('','_blank');if(!w)return alert('Allow pop-ups');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${no2}</title><style>body{font-family:'Noto Sans Bengali',Arial;max-width:620px;margin:24px auto;padding:0 12px;color:#111}.h{display:flex;justify-content:space-between;border-bottom:4px solid #d71920;padding-bottom:10px}.l{font-size:28px;font-weight:800}.l b{color:#d71920}table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:8px;border-bottom:1px solid #ddd}td:last-child{text-align:right}.d td{color:#d71920;font-weight:700;font-size:18px}</style></head><body><div class="h"><div><div class="l"><b>Repair</b> Xpert</div>Training and Service Center</div><div style="text-align:right"><b>${title}</b><br>${no2}<br>${date}</div></div><table>${party.map(row).join('')}</table><table>${lines.map(row).join('')}</table><table>${sum2.map(row).join('')}</table><p style="margin-top:40px;font-size:12px;color:#777">Thank you. Computer generated document.</p></body></html>`);
  w.document.close();setTimeout(()=>w.print(),300);
}

/* ---------- Reports ---------- */
function rng(p){const d=today();let s=d;if(p==='weekly'){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-6);s=x.toLocaleDateString('en-CA')}else if(p==='monthly')s=d.slice(0,7)+'-01';else if(p==='yearly')s=d.slice(0,4)+'-01-01';return[s,d]}
function repP(){
  const[f,to]=rng(rp),L=liveU().filter(x=>x.date>=f&&x.date<=to),inc=sum(L.filter(x=>x.type==='income'),x=>x.amt),exp=sum(L.filter(x=>x.type==='expense'),x=>x.amt);
  const by=(type)=>{const c={};L.filter(x=>x.type===type).forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);return Object.entries(c).map(([k,v])=>[k,taka(v)])};
  const S=DB.stu.map(sSum),J=DB.jobs,jd=J.filter(j=>j.delivered&&j.delivered>=f&&j.delivered<=to);
  return `<div class="row noprint"><h2 style="flex:1;margin:0">${t('Reports')}</h2><span class="tabs">${['daily','weekly','monthly','yearly'].map(p=>`<button class="${rp===p?'on':''}" onclick="rp='${p}';render()">${t(p[0].toUpperCase()+p.slice(1))}</button>`).join(' ')}</span><button class="dk" onclick="csv()">${t('Export CSV (Excel)')}</button><button class="dk" onclick="window.print()">PDF / ${t('Print')}</button></div>
  <p><b>${f}</b> → <b>${to}</b> (Asia/Dhaka)</p><div class="grid">${cd('Income',taka(inc))}${cd('Expense',taka(exp))}${cd('Profit & Loss',taka(inc-exp),inc-exp>=0?'dark':'rd')}</div>
  <h3>Income</h3>${tbl(['Category','Amount'],by('income'))}<h3 style="margin-top:14px">Expense</h3>${tbl(['Category','Amount'],by('expense'))}
  ${U()==='service'?'':'<h3 style="margin-top:14px">Student Report</h3>'}${U()==='service'?'':tbl(['New admissions','Total students','Total fees','Total paid','Total due'],[[S.filter(s=>s.date>=f&&s.date<=to).length,S.length,taka(sum(S,s=>s.fee)),taka(sum(S,s=>s.total)),taka(sum(S,s=>s.due))]])}
  ${U()==='training'?'':'<h3 style="margin-top:14px">Service Report</h3>'}${U()==='training'?'':tbl(['Received','Delivered','Pending','Profit (delivered)'],[[J.filter(j=>j.date>=f&&j.date<=to).length,jd.length,J.filter(j=>j.status!=='Delivered').length,taka(sum(jd,jProfit))]])}
  <h3 style="margin-top:14px">Employee Salary Report</h3>${tbl(['Name','Paid in period'],DB.emps.filter(e=>!U()||e.dept===U()).map(e=>[esc(e.name),taka(sum(DB.sal.filter(x=>x.eid===e.id&&x.date>=f&&x.date<=to),x=>x.amt))]))}
  <p class="warn" style="margin-top:12px">Parts cost inside a job is used only for job profit. The business expense is counted once, when parts are purchased.</p>`;
}
function csv(){
  const[f,to]=rng(rp),rows=[['Date','Type','Category','Description','Method','Amount (BDT)'],...liveU().filter(x=>x.date>=f&&x.date<=to).map(x=>[x.date,x.type,x.cat,x.desc,x.method,x.amt])];
  const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='report-'+rp+'.csv';a.click();
}

/* ---------- Users & Security ---------- */
function usrP(){
  return `<h2>${t('Users & Security')}</h2><div class="card"><b>Current role: ${role}</b> <small class="g">(change from the top right box)</small></div>
  ${tbl(['Permission','Admin','Employee'],[['Add students / jobs / payments','✔','✔'],['Change job status, use parts','✔','✔'],['Add employee, edit job price','✔','✖'],['Void financial record','✔','✖'],['View Activity Log, Backup, Restore','✔','✖'],['Permanent delete','✖','✖']])}
  ${role==='admin'?lockForm():''}<div class="row" style="margin-top:12px"><button class="btn" onclick="backup()">${t('Backup')} (JSON)</button><label class="dk" style="margin:0;cursor:pointer">${t('Restore')}<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label><button class="dk" onclick="resetDemo()">Load sample data (empty system only)</button></div>
  <h3>${t('Activity Log')}</h3>`+(role==='admin'?tbl(['Time','Role','Action','Detail'],DB.log.slice(0,60).map(l=>[l.t,esc((l.u||'')+' ('+l.role+')'),l.a,esc(l.d)])):'<div class="warn">Admin only</div>');
}
function backup(){if(!adm())return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='repair-xpert-backup-'+today()+'.json';a.click();log('Backup downloaded')}
function restore(f){if(!adm()||!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);log('Data restored');render()}catch(e){err='Invalid backup file';render()}};r.readAsText(f)}
function resetDemo(){if(!adm())return;if(DB.tx.length||DB.stu.length||DB.jobs.length||DB.emps.length){alert('System is not empty. Sample data can only be loaded into an empty system.');return}if(confirm('Load sample data?')){seed();render()}}

boot();
</script>
</body>
